name: Kanata integration validation
description: Report a fixed-version companion test without private device data.
title: "Kanata validation: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Start with the unprivileged synthetic demonstration. Physical capture is
        optional and requires separate explicit consent to its documented logging
        risks. Do not post raw captures, typing, device addresses, keys, account
        identifiers, machine paths, or personal workflows. Report failures before
        retrying. See docs/integrations/kanata-testing.md.
  - type: input
    id: revision
    attributes:
      label: InputLift commit or prerelease tag
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Kanata and Windows versions
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Furthest stage actually tested
      options:
        - Pure build and synthetic packet fixture
        - Owned loopback stub transport
        - Official Kanata configuration validation
        - Real Kanata with synthetic control events
        - Supported Bluetooth source with explicit logging opt-in
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: Observed behavior
      description: Include baseline, hold, release/reset, failure recovery, and stages not attempted.
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Exact bounded error/status, if any
      description: Review and remove private identifiers before posting.
  - type: checkboxes
    id: privacy
    attributes:
      label: Reporting boundary
      options:
        - label: This report contains no raw captures, personal configuration, typed content, or unique device/account identifiers.
          required: true
